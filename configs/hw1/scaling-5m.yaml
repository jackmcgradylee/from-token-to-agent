# W3 scaling-pilot: 5M-class model (target N ≈ 6.9M actual).

model:
  vocab_size: 2048
  d_model: 192
  n_layers: 16
  n_heads: 4
  n_kv_heads: 2
  head_dim: 48
  max_seq_len: 128
  rope_theta: 10000.0
  dropout: 0.0
  init_std: 0.02
  tie_word_embeddings: true

tokenizer:
  vocab_size: 2048
  min_pair_freq: 2

data:
  path: data/raw/sample.txt

training:
  lr: 3.0e-4
  min_lr_ratio: 0.1
  warmup_steps: 20
  weight_decay: 0.1
  grad_clip: 1.0
  beta1: 0.9
  beta2: 0.95
  eps: 1.0e-8
  batch_size: 4
  grad_accum: 2
  max_steps: 100
  log_every: 10
  eval_every: 1000
  val_size: 500
  precision: fp32
  seed: 42

ckpt_dir: checkpoints/w3/scaling-5m
log_csv: loss_curve.csv